<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#05060f" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cortes Simulador" />
<title>Peluquero</title>
<link rel="stylesheet" href="assets/theme.css" />
<style>
  /* Entrada del peluquero con PIN (BARBER_PIN en el servidor). En la tablet
     compartida protege las fichas de los clientes. */
  .page-shell { max-width: 380px; text-align: center; }
  .dots { display: flex; justify-content: center; gap: 14px; margin: 26px 0 22px; }
  .dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--glass-border); transition: all 0.15s; }
  .dots span.on { background: var(--accent-cyan); border-color: var(--accent-cyan); }
  .dots.shake { animation: shake 0.35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pad button { margin: 0; min-height: 64px; font-size: 24px; font-weight: 700; border-radius: 18px; background: var(--glass); }
  .pad button:hover { box-shadow: none; }
  .pad .ico { width: 24px; height: 24px; }
  .lock { color: var(--accent-cyan); margin: 10px 0 0; }
  .lock .ico { width: 40px; height: 40px; stroke-width: 1.6; }
  #status { margin-top: 16px; min-height: 22px; display: flex; justify-content: center; }
</style>
</head>
<body>
<div class="page-shell">
  <nav class="top-nav"><a href="inicio.html" aria-label="Inicio"><span data-icon="house"></span></a></nav>
  <div class="lock"><span data-icon="lock"></span></div>
  <h1 class="page-title" style="margin-top:8px;">Peluquero</h1>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
  <div id="status" role="status"></div>
</div>
<script src="assets/ui.js"></script>
<script src="assets/session.js"></script>
<script>
  const LEN = 4;          // se envía al llegar a 4 cifras; si el PIN es más largo, con "OK"
  let pin = "";
  const next = new URLSearchParams(location.search).get("next") || "sala.html";
  const safeNext = /^[a-z0-9_-]+\.html(\?.*)?$/i.test(next) ? next : "sala.html";
  const statusEl = document.getElementById("status");
  function say(kind, text) {
    const icon = { ok: "circle-check", warn: "triangle-alert", busy: "loader-circle" }[kind];
    statusEl.innerHTML = `<div class="status-line ${kind}">${UI.icon(icon, kind === "busy" ? "spin" : "")}<span>${text}</span></div>`;
  }
  function renderDots() {
    const n = Math.max(LEN, pin.length);
    document.getElementById("dots").innerHTML = Array.from({ length: n }, (_, i) => `<span class="${i < pin.length ? "on" : ""}"></span>`).join("");
  }
  async function send() {
    say("busy", "Comprobando…");
    const res = await fetch("/api/barber/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin }) });
    if (res.ok) { location.href = safeNext; return; }
    const err = await res.json().catch(() => ({}));
    pin = ""; renderDots();
    const dots = document.getElementById("dots");
    dots.classList.remove("shake"); void dots.offsetWidth; dots.classList.add("shake");
    say("warn", err.detail || "PIN incorrecto");
  }
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "del", "0", "ok"];
  document.getElementById("pad").innerHTML = keys.map((k) =>
    `<button type="button" data-k="${k}" aria-label="${k === "del" ? "Borrar" : k === "ok" ? "Entrar" : k}">${
      k === "del" ? UI.icon("chevron-left") : k === "ok" ? UI.icon("check") : k}</button>`).join("");
  document.getElementById("pad").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const k = b.dataset.k;
    if (k === "del") pin = pin.slice(0, -1);
    else if (k === "ok") { if (pin) send(); return; }
    else if (pin.length < 8) pin += k;
    renderDots();
    if (pin.length === LEN) send();
  });
  document.addEventListener("keydown", (e) => {
    if (/^\d$/.test(e.key)) { pin += e.key; renderDots(); if (pin.length === LEN) send(); }
    else if (e.key === "Backspace") { pin = pin.slice(0, -1); renderDots(); }
    else if (e.key === "Enter" && pin) send();
  });
  renderDots();
  (async () => {
    if (Session.isQr()) { location.href = "cliente.html"; return; }
    const s = await (await fetch("/api/barber/session")).json();
    if (s.logged_in) location.href = safeNext;
    else if (!s.pin_configured) say("warn", "Falta configurar BARBER_PIN en el servidor (Railway → Variables).");
  })();
</script>
</body>
</html>
