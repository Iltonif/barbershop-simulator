<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#05060f" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cortes Simulador" />
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
<title>Cortes recomendados</title>
<link rel="stylesheet" href="assets/theme.css" />
<style>
  .page-head { margin-bottom: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px;
          background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-main); text-decoration: none; }
  .chip .ico { color: var(--accent-cyan); width: 15px; height: 15px; }
  .chip.missing { border-style: dashed; color: var(--text-dim); }
  .chip.missing .ico { color: var(--text-faint); }
  #status { font-size: 13px; color: var(--text-faint); margin: 14px 0; }
  #status .warning { display: flex; align-items: center; gap: 8px; font-size: 14px; }

  #search-section { display: none; margin: 8px 0 20px; max-width: 460px; }
  .inline-form { display: flex; gap: 8px; }
  .inline-form input { flex: 1; min-width: 0; }
  .inline-form button { width: auto; margin: 0; white-space: nowrap; }
  .cut-top { display: flex; align-items: center; gap: 8px; }
  .cut-top .cut-name { margin: 0; }
  .cut-top details.info > summary { width: 24px; height: 24px; }
  .card { position: relative; }
  .card:has(details.info[open]) { z-index: 40; }
  .card-body, .cut-item { position: relative; }
  .card details.info > .info-body { max-height: 60vh; overflow-y: auto; }
  /* En el móvil la tarjeta es estrecha: el "por qué" se abre como una hoja
     abajo de la pantalla, a todo lo ancho (por eso la tarjeta no lleva
     backdrop-filter, que haría de contenedor del position: fixed). */
  @media (max-width: 640px) {
    .card details.info > .info-body { position: fixed; left: 12px; right: 12px; top: auto; bottom: 12px;
                                      max-width: none; z-index: 80; font-size: 13.5px; }
  }
  .why.more { background: var(--glass); color: var(--text-dim); border: 1px solid var(--glass-border); }
  .note { display: flex; align-items: flex-start; gap: 6px; }
  .whys { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .why { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-size: 11.5px;
         font-weight: 600; line-height: 1.3; }
  .why .ico { width: 12px; height: 12px; stroke-width: 3; flex: none; }
  .why.plus { background: rgba(52, 211, 153, 0.12); color: #86e6c4; border: 1px solid rgba(52, 211, 153, 0.3); }
  .why.minus { background: var(--warning-bg); color: var(--warning); border: 1px solid var(--warning-border); }
  .why-line { display: flex; gap: 8px; align-items: flex-start; }
  .why-line .ico { width: 14px; height: 14px; flex: none; margin-top: 2px; }
  .why-line.plus .ico { color: var(--ok); }
  .why-line.minus .ico { color: var(--warning); }
  .why-line b { color: var(--text-main); }
  .beard-row { margin: 14px 0 0; gap: 8px; }
  .beard-title { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
  .beard-title .ico { color: var(--accent-cyan); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 8px;
    align-items: start;
  }
  .card {
    border: 1px solid var(--glass-border); border-radius: 14px; overflow: visible;
    display: flex; flex-direction: column; background: rgba(20, 23, 36, 0.92);
  }
  .card img { width: 100%; height: 220px; object-fit: cover; display: block; background: rgba(255,255,255,0.05); border-radius: 13px 13px 0 0; }
  .no-photo {
    width: 100%; height: 220px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.04); color: var(--text-faint); font-size: 13px; text-align: center; padding: 12px; box-sizing: border-box;
  }
  .card-body { padding: 14px 16px 18px; }
  .card-body h3 { margin: 0 0 2px; font-size: 16px; color: var(--text-main); }
  .family-hint { margin: 0 0 12px; font-size: 12px; color: var(--text-faint); }
  .cut-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .cut-item { border-top: 1px solid var(--glass-border); padding-top: 10px; }
  .cut-item:first-child { border-top: none; padding-top: 0; }
  .cut-item.con-aviso { background: var(--warning-bg); margin: 0 -16px; padding: 10px 16px; border-top-color: var(--warning-border); border-radius: 8px; }
  .cut-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text-main); }
  .cut-desc { margin: 0 0 6px; font-size: 12px; color: var(--text-dim); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .badge {
    font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(79, 124, 255, 0.18); color: #c7d4ff;
    white-space: nowrap;
  }
  .badge.fade { background: rgba(52, 211, 153, 0.15); color: #86e6c4; }
  .badge .ico { width: 11px; height: 11px; margin-right: 3px; vertical-align: -1px; }
  .note { font-size: 12px; color: var(--warning); margin-top: 4px; }
  .source { font-size: 10px; color: var(--text-faint); margin-top: 2px; }
  details.more > summary { cursor: pointer; font-size: 12px; color: var(--accent-cyan); padding-top: 8px; list-style: none; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more[open] > summary { margin-bottom: 6px; }
  .cut-top h3 { margin: 0 0 6px; flex: 1; }
  .card-body.con-aviso { background: var(--warning-bg); border-radius: 0 0 13px 13px; }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card img, .no-photo { height: 170px; }
    .card-body { padding: 10px 10px 12px; }
    .card-body h3 { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="page-shell">
  <nav class="top-nav">
    <a href="inicio.html" aria-label="Inicio"><span data-icon="house"></span></a>
    <a href="catalogo.html" title="Catálogo"><span data-icon="layout-grid"></span><span class="lbl">Catálogo</span></a>
    <a id="growth-map-link" href="growth-map.html" title="Remolinos"><span data-icon="compass"></span><span class="lbl">Remolinos</span></a>
  </nav>

  <div class="head-row page-head">
    <h1 class="page-title">Recomendaciones</h1>
    <details class="info"><summary></summary><div class="info-body">
      Cortes del catálogo para tu tipo de pelo, ordenados según tu ficha: forma de cara, rasgos, remolinos y lo que respondiste en "Mi perfil". <span data-icon="check"></span> dice por qué encaja un corte y <span data-icon="triangle-alert"></span> qué no encaja; el <span data-icon="info"></span> de cada corte lo explica.
    </div></details>
  </div>
  <div id="subtitle" class="chips"></div>

  <div id="beard"></div>
  <div id="growth"></div>
  <div id="status"></div>
  <div id="grid" class="grid"></div>
</div>

  <script src="assets/ui.js"></script>
  <script src="assets/session.js"></script>
  <script>
    // Ruta RELATIVA a propósito (no "http://localhost:8000/api" fijo, como
    // estaba antes): el backend sirve este mismo HTML como estático (ver
    // el mount de StaticFiles en app/main.py), así que la API siempre está
    // en el mismo origen que la página, sea localhost, la IP local en la
    // WiFi de la barbería, o el dominio real de Railway en producción. La
    // URL fija rompía los tres casos salvo el primero -- detectado al
    // probar la web ya desplegada de verdad (catálogo/simulador daban
    // "Failed to fetch" porque intentaban llamar al localhost del propio
    // dispositivo del cliente, no al servidor real).
    const API_BASE = "/api";
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get("client_id");

    const subtitleEl = document.getElementById("subtitle");
    const statusEl = document.getElementById("status");
    const gridEl = document.getElementById("grid");
    const growthMapLink = document.getElementById("growth-map-link");

    const HAIR_TEXTURE_LABELS = {
      liso: "liso", ondulado: "ondulado", rizado: "rizado", afro: "afro",
    };
    const FACE_SHAPE_LABELS = {
      ovalada: "ovalada", redonda: "redonda", cuadrada: "cuadrada", alargada: "alargada",
    };
    const FADE_LABELS = {
      ninguno: "sin degradado", bajo: "fade bajo", medio: "fade medio",
      alto: "fade alto", skin: "fade a piel",
    };
    const LENGTH_LABELS = {
      corto: "corto", medio: "medio", largo: "largo", extra_largo: "extra largo",
    };
    // Etiquetas legibles para las "familias visuales" usadas para agrupar
    // cortes que comparten una misma foto de referencia de stock (ver
    // backend/app/pipeline/style_catalog.py y el script que las asignó).
    // Sin esto, la página listaba una tarjeta por cada uno de los 104
    // cortes del catálogo repitiendo la misma foto una y otra vez.
    const FAMILY_LABELS = {
      mullet: "Mullet",
      fade_undercut_textura: "Fade / undercut con textura",
      tupe_pompadour_clasico: "Tupé / pompadour clásico",
      buzz_corto_uniforme: "Buzz cut / corte corto uniforme",
      corte_texturizado_general: "Corte corto texturizado",
      clasico_raya_lateral: "Clásico con raya lateral",
      rastas_trenzas_locs: "Rastas / trenzas",
      recogido_mono_coleta: "Moño / coleta recogida",
      melena_larga: "Melena larga",
      afro_rizado_voluminoso: "Afro / rizado voluminoso",
      corte_tazon_bowl_liso: "Corte tazón (bowl cut) — pelo liso/ondulado",
      corte_tazon_bowl_rizado: "Corte tazón (bowl cut) — pelo rizado",
    };

    const MAX_VISIBLE_PER_FAMILY = 4;

    function cutBadgesHtml(s) {
      const badges = [];
      if (s.length_category) badges.push(`<span class="badge">${LENGTH_LABELS[s.length_category] || s.length_category}</span>`);
      badges.push(`<span class="badge fade">${FADE_LABELS[s.fade_type] || s.fade_type}</span>`);
      if (s.maintenance_weeks) badges.push(`<span class="badge" title="Retoque cada ${s.maintenance_weeks[0]}-${s.maintenance_weeks[1]} semanas">${UI.icon("calendar-clock")}${s.maintenance_weeks[0]}-${s.maintenance_weeks[1]} sem.</span>`);
      return `<div class="badges">${badges.join("")}</div>`;
    }

    // Por qué encaja (verde) y qué no encaja (ámbar): etiquetas cortas en
    // la tarjeta; la explicación completa de cada una, en el ⓘ.
    // Como mucho 3 etiquetas por tarjeta (los avisos primero, que son los
    // que cambian la decisión); el resto se cuenta en "+N" y está en el ⓘ.
    const MAX_WHYS = 3;
    function whyChipsHtml(rec) {
      const minus = (rec.warnings || []).map((w) => `<span class="why minus">${UI.icon("triangle-alert")}${w.label}</span>`);
      const plus = (rec.reasons || []).map((r) => `<span class="why plus">${UI.icon("check")}${r.label}</span>`);
      const all = [...minus, ...plus];
      if (!all.length) return "";
      const shown = all.slice(0, MAX_WHYS);
      const more = all.length - shown.length;
      return `<div class="whys">${shown.join("")}${more > 0 ? `<span class="why more">+${more}</span>` : ""}</div>`;
    }
    function infoHtml(rec) {
      const s = rec.style;
      const lines = [
        ...(rec.reasons || []).map((r) => `<p class="why-line plus">${UI.icon("check")}<span><b>${r.label}.</b> ${r.detail}</span></p>`),
        ...(rec.warnings || []).map((w) => `<p class="why-line minus">${UI.icon("triangle-alert")}<span><b>${w.label}.</b> ${w.detail}</span></p>`),
      ];
      const body = (s.description ? `<p>${s.description}</p>` : "") + lines.join("");
      return body ? `<details class="info"><summary aria-label="Por qué">${UI.icon("info")}</summary><div class="info-body">${body}</div></details>` : "";
    }

    function cutItemHtml(rec) {
      const s = rec.style;
      return `
        <li class="cut-item">
          <div class="cut-top"><div class="cut-name">${s.name}</div>${infoHtml(rec)}</div>
          ${cutBadgesHtml(s)}
          ${whyChipsHtml(rec)}
        </li>
      `;
    }

    function renderFamilyCard(family) {
      const card = document.createElement("div");
      card.className = "card";

      const photoHtml = family.referenceImage
        ? `<img src="${family.referenceImage}" alt="Foto de referencia: ${family.label}" loading="lazy" />`
        : `<div class="no-photo">${UI.icon("image")}</div>`;

      const visible = family.items.slice(0, MAX_VISIBLE_PER_FAMILY);
      const rest = family.items.slice(MAX_VISIBLE_PER_FAMILY);


      if (family.items.length === 1) {
        const rec = family.items[0];
        card.innerHTML = `
          ${photoHtml}
          <div class="card-body">
            <div class="cut-top"><h3>${family.label}</h3>${infoHtml(rec)}</div>
            ${cutBadgesHtml(rec.style)}
            ${whyChipsHtml(rec)}
          </div>
        `;
        return card;
      }
      const visibleHtml = visible.map(cutItemHtml).join("");
      const restHtml = rest.length
        ? `<details class="more"><summary>+${rest.length}</summary>
             <ul class="cut-list">${rest.map(cutItemHtml).join("")}</ul>
           </details>`
        : "";

      card.innerHTML = `
        ${photoHtml}
        <div class="card-body">
          <h3>${family.label}</h3>
          ${family.items.length > 1 ? `<p class="family-hint">${family.items.length} cortes</p>` : ""}
          <ul class="cut-list">${visibleHtml}</ul>
          ${restHtml}
        </div>
      `;
      return card;
    }

    function groupByFamily(recommendations) {
      const families = new Map();
      for (const rec of recommendations) {
        // Igual que en catalogo.html: cada corte tiene su propia foto, así que
        // se agrupa por foto (antes por familia, y la tarjeta enseñaba la foto
        // de otro corte de la familia).
        const key = rec.style.reference_image || rec.style.style_family || rec.style.id;
        if (!families.has(key)) {
          families.set(key, {
            key,
            label: FAMILY_LABELS[key] || rec.style.style_family || rec.style.name,
            referenceImage: rec.style.reference_image,
            items: [],
          });
        }
        families.get(key).items.push(rec);
      }
      for (const family of families.values()) {
        if (family.items.length === 1) family.label = family.items[0].style.name;
      }
      // El orden de inserción ya viene de la lista original (los cortes
      // sin aviso de remolinos primero), así que las familias que solo
      // tienen avisos quedan al final de forma natural.
      return Array.from(families.values());
    }

    // Dos modos: el propio cliente (su sesión, /api/me) o el peluquero con
    // la ficha de un cliente abierta (?client_id=, necesita su PIN).
    const barberMode = !!clientId;
    const ficha = (path) => barberMode ? `${path}?client_id=${encodeURIComponent(clientId)}` : path;

    async function load() {
      let client, data;
      try {
        if (barberMode) {
          await Session.requireBarber();
          growthMapLink.href = ficha("growth-map.html");
          document.querySelector('nav a[aria-label="Inicio"]').href = ficha("ficha.html");
          const clientRes = await fetch(`${API_BASE}/clients/${clientId}`);
          if (!clientRes.ok) {
            statusEl.innerHTML = `<span class="warning">${UI.icon("triangle-alert")}Cliente no encontrado</span>`;
            return;
          }
          client = await clientRes.json();
          data = await (await fetch(`${API_BASE}/clients/${clientId}/recommendations`)).json();
        } else {
          client = await Session.requireClient();
          document.querySelector('nav a[aria-label="Inicio"]').href = "cliente.html";
          growthMapLink.hidden = true;  // herramienta del peluquero
          data = await (await fetch(`${API_BASE}/me/recommendations`)).json();
          Session.setLikes(data.liked_styles);
        }
      } catch (e) {
        statusEl.innerHTML = `<span class="warning">${UI.icon("triangle-alert")}Sin conexión: ${e.message}</span>`;
        return;
      }
      render(client, data);
    }

    function render(client, data) {
      const name = client.display_name || "Cliente";
      const chip = (icon, text, extra = "") => `<span class="chip${extra}">${UI.icon(icon)}${text}</span>`;
      const quiz = ficha("cuestionario.html");
      subtitleEl.innerHTML = [
        chip("user-round", name),
        data.hair_texture
          ? chip("scissors", (HAIR_TEXTURE_LABELS[data.hair_texture] || data.hair_texture) +
              (data.hair_texture_source === "cliente" ? " (según tú)" : ""))
          // Sin tipo de pelo no se filtra: se ordena todo el catálogo.
          : `<a class="chip missing" href="${quiz}">${UI.icon("scissors")}+ tipo de pelo</a>`,
        data.face_shape
          ? chip("scan-face", FACE_SHAPE_LABELS[data.face_shape] || data.face_shape)
          : `<a class="chip missing" href="${quiz}">${UI.icon("scan-face")}+ forma de cara</a>`,
        `<a class="chip" href="${quiz}" title="Responder o cambiar el cuestionario">${UI.icon("clipboard-list")}${barberMode ? "Cuestionario" : "Mi perfil"}</a>`,
      ].join("");

      if (data.recommendations.length === 0) {
        statusEl.textContent = "Sin cortes compatibles todavía";
        return;
      }
      const beard = data.beard_advice || [];
      document.getElementById("beard").innerHTML = beard.length
        ? `<div class="head-row beard-row"><span class="beard-title">${UI.icon("scissors")}Barba</span>${beard.map((b) =>
            `<span class="why plus">${UI.icon("check")}${b.label}</span>`).join("")}
            <details class="info"><summary aria-label="Consejo de barba">${UI.icon("info")}</summary><div class="info-body">${beard.map((b) =>
            `<p><b>${b.label}.</b> ${b.detail}</p>`).join("")}</div></details></div>`
        : "";
      // Cómo crece su pelo (del mapa de remolinos), con el detalle en el ⓘ.
      const growth = data.growth_summary || [];
      document.getElementById("growth").innerHTML = growth.length
        ? `<div class="head-row beard-row"><span class="beard-title">${UI.icon("rotate-cw")}Crecimiento</span>${
            data.natural_part ? `<span class="why plus">${UI.icon("check")}Raya a su ${data.natural_part}</span>` : ""}
            <span class="why">${growth.length} dato${growth.length === 1 ? "" : "s"}</span>
            <details class="info"><summary aria-label="Cómo crece el pelo">${UI.icon("info")}</summary><div class="info-body">${growth.map((l) =>
            `<p>${l}</p>`).join("")}<p class="hint">Las recomendaciones lo tienen en cuenta (remolinos, hacia dónde crece, raya).</p></div></details></div>`
        : "";
      const families = groupByFamily(data.recommendations);
      statusEl.textContent = `${data.recommendations.length} cortes`;
      gridEl.innerHTML = "";
      for (const family of families) {
        const card = renderFamilyCard(family);
        // Corazón para guardar el corte (cliente) o ver que le gusta (peluquero).
        if (family.items.length === 1) {
          const id = family.items[0].style.id;
          if (!barberMode) card.insertAdjacentHTML("afterbegin", Session.heartHtml(id));
          else if ((client.liked_styles || []).includes(id)) {
            card.insertAdjacentHTML("afterbegin", `<span class="heart-btn" aria-pressed="true" title="Le gusta">${UI.icon("heart")}</span>`);
          }
        }
        gridEl.appendChild(card);
      }
    }

    load();
  </script>
</body>
</html>
