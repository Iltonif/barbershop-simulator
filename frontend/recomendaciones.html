<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#05060f" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cortes Simulador" />
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
<title>Cortes recomendados</title>
<link rel="stylesheet" href="assets/theme.css" />
<style>
  .page-head { margin-bottom: 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 13px;
          background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-main); text-decoration: none; }
  .chip .ico { color: var(--accent-cyan); width: 15px; height: 15px; }
  .chip.missing { border-style: dashed; color: var(--text-dim); }
  .chip.missing .ico { color: var(--text-faint); }
  #status { font-size: 13px; color: var(--text-faint); margin: 14px 0; }
  #status .warning { display: flex; align-items: center; gap: 8px; font-size: 14px; }

  #search-section { display: none; margin: 8px 0 20px; max-width: 460px; }
  .inline-form { display: flex; gap: 8px; }
  .inline-form input { flex: 1; min-width: 0; }
  .inline-form button { width: auto; margin: 0; white-space: nowrap; }
  .cut-top { display: flex; align-items: center; gap: 8px; }
  .cut-top .cut-name { margin: 0; }
  .cut-top details.info > summary { width: 24px; height: 24px; }
  .card { position: relative; }
  .card:has(details.info[open]) { z-index: 40; }
  .card-body, .cut-item { position: relative; }
  .card details.info > .info-body { top: auto; bottom: calc(100% + 6px); }
  .note { display: flex; align-items: flex-start; gap: 6px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 8px;
    align-items: start;
  }
  .card {
    border: 1px solid var(--glass-border); border-radius: 14px; overflow: visible;
    display: flex; flex-direction: column; background: var(--glass);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .card img { width: 100%; height: 220px; object-fit: cover; display: block; background: rgba(255,255,255,0.05); border-radius: 13px 13px 0 0; }
  .no-photo {
    width: 100%; height: 220px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.04); color: var(--text-faint); font-size: 13px; text-align: center; padding: 12px; box-sizing: border-box;
  }
  .card-body { padding: 14px 16px 18px; }
  .card-body h3 { margin: 0 0 2px; font-size: 16px; color: var(--text-main); }
  .family-hint { margin: 0 0 12px; font-size: 12px; color: var(--text-faint); }
  .cut-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .cut-item { border-top: 1px solid var(--glass-border); padding-top: 10px; }
  .cut-item:first-child { border-top: none; padding-top: 0; }
  .cut-item.con-aviso { background: var(--warning-bg); margin: 0 -16px; padding: 10px 16px; border-top-color: var(--warning-border); border-radius: 8px; }
  .cut-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text-main); }
  .cut-desc { margin: 0 0 6px; font-size: 12px; color: var(--text-dim); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .badge {
    font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(79, 124, 255, 0.18); color: #c7d4ff;
    white-space: nowrap;
  }
  .badge.fade { background: rgba(52, 211, 153, 0.15); color: #86e6c4; }
  .note { font-size: 12px; color: var(--warning); margin-top: 4px; }
  .source { font-size: 10px; color: var(--text-faint); margin-top: 2px; }
  details.more > summary { cursor: pointer; font-size: 12px; color: var(--accent-cyan); padding-top: 8px; list-style: none; }
  details.more > summary::-webkit-details-marker { display: none; }
  details.more[open] > summary { margin-bottom: 6px; }
  .cut-top h3 { margin: 0 0 6px; flex: 1; }
  .card-body.con-aviso { background: var(--warning-bg); border-radius: 0 0 13px 13px; }
  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card img, .no-photo { height: 170px; }
    .card-body { padding: 10px 10px 12px; }
    .card-body h3 { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="page-shell">
  <nav class="top-nav">
    <a href="inicio.html" aria-label="Inicio"><span data-icon="house"></span></a>
    <a href="catalogo.html" title="Catálogo"><span data-icon="layout-grid"></span><span class="lbl">Catálogo</span></a>
    <a id="growth-map-link" href="growth-map.html" title="Remolinos"><span data-icon="compass"></span><span class="lbl">Remolinos</span></a>
  </nav>

  <div class="head-row page-head">
    <h1 class="page-title">Recomendaciones</h1>
    <details class="info"><summary></summary><div class="info-body">
      Cortes del catálogo que encajan con el tipo de pelo, la forma de cara y los remolinos guardados en la ficha. Los marcados con <span data-icon="triangle-alert"></span> pueden dar guerra con algún remolino.
    </div></details>
  </div>
  <div id="subtitle" class="chips"></div>

  <div id="search-section">
    <div class="inline-form">
      <input type="text" id="search-name" placeholder="Tu nombre (como en la barbería)" aria-label="Escribe tu nombre tal como lo diste en la barbería" />
      <button id="search-btn" type="button" aria-label="Buscar mi perfil"><span data-icon="search"></span>Buscar</button>
    </div>
  </div>

  <div id="status"></div>
  <div id="grid" class="grid"></div>
</div>

  <script src="assets/ui.js"></script>
  <script>
    // Ruta RELATIVA a propósito (no "http://localhost:8000/api" fijo, como
    // estaba antes): el backend sirve este mismo HTML como estático (ver
    // el mount de StaticFiles en app/main.py), así que la API siempre está
    // en el mismo origen que la página, sea localhost, la IP local en la
    // WiFi de la barbería, o el dominio real de Railway en producción. La
    // URL fija rompía los tres casos salvo el primero -- detectado al
    // probar la web ya desplegada de verdad (catálogo/simulador daban
    // "Failed to fetch" porque intentaban llamar al localhost del propio
    // dispositivo del cliente, no al servidor real).
    const API_BASE = "/api";
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get("client_id");

    const subtitleEl = document.getElementById("subtitle");
    const statusEl = document.getElementById("status");
    const gridEl = document.getElementById("grid");
    const growthMapLink = document.getElementById("growth-map-link");

    const HAIR_TEXTURE_LABELS = {
      liso: "liso", ondulado: "ondulado", rizado: "rizado", afro: "afro",
    };
    const FACE_SHAPE_LABELS = {
      ovalada: "ovalada", redonda: "redonda", cuadrada: "cuadrada", alargada: "alargada",
    };
    const FADE_LABELS = {
      ninguno: "sin degradado", bajo: "fade bajo", medio: "fade medio",
      alto: "fade alto", skin: "fade a piel",
    };
    const LENGTH_LABELS = {
      corto: "corto", medio: "medio", largo: "largo", extra_largo: "extra largo",
    };
    // Etiquetas legibles para las "familias visuales" usadas para agrupar
    // cortes que comparten una misma foto de referencia de stock (ver
    // backend/app/pipeline/style_catalog.py y el script que las asignó).
    // Sin esto, la página listaba una tarjeta por cada uno de los 104
    // cortes del catálogo repitiendo la misma foto una y otra vez.
    const FAMILY_LABELS = {
      mullet: "Mullet",
      fade_undercut_textura: "Fade / undercut con textura",
      tupe_pompadour_clasico: "Tupé / pompadour clásico",
      buzz_corto_uniforme: "Buzz cut / corte corto uniforme",
      corte_texturizado_general: "Corte corto texturizado",
      clasico_raya_lateral: "Clásico con raya lateral",
      rastas_trenzas_locs: "Rastas / trenzas",
      recogido_mono_coleta: "Moño / coleta recogida",
      melena_larga: "Melena larga",
      afro_rizado_voluminoso: "Afro / rizado voluminoso",
      corte_tazon_bowl_liso: "Corte tazón (bowl cut) — pelo liso/ondulado",
      corte_tazon_bowl_rizado: "Corte tazón (bowl cut) — pelo rizado",
    };

    const MAX_VISIBLE_PER_FAMILY = 4;

    function cutBadgesHtml(s) {
      const badges = [];
      if (s.length_category) badges.push(`<span class="badge">${LENGTH_LABELS[s.length_category] || s.length_category}</span>`);
      badges.push(`<span class="badge fade">${FADE_LABELS[s.fade_type] || s.fade_type}</span>`);
      return `<div class="badges">${badges.join("")}</div>`;
    }

    function cutItemHtml(rec) {
      const s = rec.style;
      const noteHtml = rec.note ? `<div class="note">${UI.icon("triangle-alert")}<span>${rec.note}</span></div>` : "";
      // La descripción va plegada en un ⓘ para no llenar la tarjeta de texto.
      const infoHtml = s.description
        ? `<details class="info"><summary aria-label="Descripción">${UI.icon("info")}</summary><div class="info-body">${s.description}</div></details>`
        : "";
      return `
        <li class="cut-item${rec.note ? " con-aviso" : ""}">
          <div class="cut-top"><div class="cut-name">${s.name}</div>${infoHtml}</div>
          ${cutBadgesHtml(s)}
          ${noteHtml}
        </li>
      `;
    }

    function renderFamilyCard(family) {
      const card = document.createElement("div");
      card.className = "card";

      const photoHtml = family.referenceImage
        ? `<img src="${family.referenceImage}" alt="Foto de referencia: ${family.label}" loading="lazy" />`
        : `<div class="no-photo">${UI.icon("image")}</div>`;

      const visible = family.items.slice(0, MAX_VISIBLE_PER_FAMILY);
      const rest = family.items.slice(MAX_VISIBLE_PER_FAMILY);


      if (family.items.length === 1) {
        const rec = family.items[0];
        const infoHtml = rec.style.description
          ? `<details class="info"><summary aria-label="Descripción">${UI.icon("info")}</summary><div class="info-body">${rec.style.description}</div></details>`
          : "";
        card.innerHTML = `
          ${photoHtml}
          <div class="card-body${rec.note ? " con-aviso" : ""}">
            <div class="cut-top"><h3>${family.label}</h3>${infoHtml}</div>
            ${cutBadgesHtml(rec.style)}
            ${rec.note ? `<div class="note">${UI.icon("triangle-alert")}<span>${rec.note}</span></div>` : ""}
          </div>
        `;
        return card;
      }
      const visibleHtml = visible.map(cutItemHtml).join("");
      const restHtml = rest.length
        ? `<details class="more"><summary>+${rest.length}</summary>
             <ul class="cut-list">${rest.map(cutItemHtml).join("")}</ul>
           </details>`
        : "";

      card.innerHTML = `
        ${photoHtml}
        <div class="card-body">
          <h3>${family.label}</h3>
          ${family.items.length > 1 ? `<p class="family-hint">${family.items.length} cortes</p>` : ""}
          <ul class="cut-list">${visibleHtml}</ul>
          ${restHtml}
        </div>
      `;
      return card;
    }

    function groupByFamily(recommendations) {
      const families = new Map();
      for (const rec of recommendations) {
        // Igual que en catalogo.html: cada corte tiene su propia foto, así que
        // se agrupa por foto (antes por familia, y la tarjeta enseñaba la foto
        // de otro corte de la familia).
        const key = rec.style.reference_image || rec.style.style_family || rec.style.id;
        if (!families.has(key)) {
          families.set(key, {
            key,
            label: FAMILY_LABELS[key] || rec.style.style_family || rec.style.name,
            referenceImage: rec.style.reference_image,
            items: [],
          });
        }
        families.get(key).items.push(rec);
      }
      for (const family of families.values()) {
        if (family.items.length === 1) family.label = family.items[0].style.name;
      }
      // El orden de inserción ya viene de la lista original (los cortes
      // sin aviso de remolinos primero), así que las familias que solo
      // tienen avisos quedan al final de forma natural.
      return Array.from(families.values());
    }

    async function loadForClientId(id) {
      growthMapLink.href = `growth-map.html?client_id=${encodeURIComponent(id)}`;

      try {
        const clientRes = await fetch(`${API_BASE}/clients/${id}`);
        if (!clientRes.ok) {
          subtitleEl.textContent = "";
          statusEl.innerHTML = `<span class="warning">${UI.icon("triangle-alert")}Cliente no encontrado</span>`;
          return;
        }
        const client = await clientRes.json();
        const name = client.display_name || "este cliente";

        const recRes = await fetch(`${API_BASE}/clients/${id}/recommendations`);
        if (recRes.status === 422) {
          const err = await recRes.json();
          subtitleEl.innerHTML = `<span class="chip">${UI.icon("user-round")}${name}</span>`;
          statusEl.innerHTML = `<span class="warning">${UI.icon("triangle-alert")}${err.detail}</span>`;
          return;
        }
        if (!recRes.ok) {
          const err = await recRes.json().catch(() => ({}));
          statusEl.innerHTML = `<span class="warning">${UI.icon("triangle-alert")}Error: ${err.detail || recRes.statusText}</span>`;
          return;
        }
        const data = await recRes.json();

        const chip = (icon, text, extra = "") => `<span class="chip${extra}">${UI.icon(icon)}${text}</span>`;
        const growthHref = `growth-map.html?client_id=${encodeURIComponent(id)}`;
        subtitleEl.innerHTML = [
          chip("user-round", name),
          chip("scissors", HAIR_TEXTURE_LABELS[data.hair_texture] || data.hair_texture),
          data.face_shape
            ? chip("scan-face", FACE_SHAPE_LABELS[data.face_shape] || data.face_shape)
            // Sin forma de cara: las recomendaciones solo usan el tipo de pelo.
            : `<a class="chip missing" href="${growthHref}" title="Añadir la forma de cara en la ficha">${UI.icon("scan-face")}+ forma de cara</a>`,
          data.whorl_count > 0 ? chip("rotate-cw", `${data.whorl_count} remolino${data.whorl_count === 1 ? "" : "s"}`) : "",
        ].join("");

        if (data.recommendations.length === 0) {
          statusEl.textContent = "Sin cortes compatibles todavía";
          return;
        }

        const families = groupByFamily(data.recommendations);
        statusEl.textContent = `${data.recommendations.length} cortes`;
        gridEl.innerHTML = "";
        for (const family of families) {
          gridEl.appendChild(renderFamilyCard(family));
        }
      } catch (e) {
        statusEl.innerHTML = `<span class="warning">${UI.icon("triangle-alert")}Sin conexión: ${e.message}</span>`;
      }
    }

    async function searchByName() {
      const name = document.getElementById("search-name").value.trim();
      if (!name) {
        statusEl.innerHTML = `<span class="warning">${UI.icon("triangle-alert")}Escribe tu nombre</span>`;
        return;
      }
      statusEl.textContent = "Buscando…";
      try {
        const res = await fetch(`${API_BASE}/clients`);
        const clients = await res.json();
        const match = clients.find(
          (c) => (c.display_name || "").trim().toLowerCase() === name.toLowerCase()
        );
        if (!match) {
          statusEl.innerHTML = `<span class="warning">${UI.icon("user-search")}No hay ninguna ficha con ese nombre exacto · pregunta en el mostrador</span>`;
          return;
        }
        // Deja la URL apuntando a este cliente, para poder recargar o
        // compartir el enlace directamente la próxima vez.
        const newUrl = `${window.location.pathname}?client_id=${encodeURIComponent(match.id)}`;
        window.history.replaceState({}, "", newUrl);
        document.getElementById("search-section").style.display = "none";
        await loadForClientId(match.id);
      } catch (e) {
        statusEl.innerHTML = `<span class="warning">${UI.icon("triangle-alert")}Sin conexión: ${e.message}</span>`;
      }
    }

    document.getElementById("search-btn").addEventListener("click", searchByName);
    document.getElementById("search-name").addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchByName();
    });

    if (clientId) {
      loadForClientId(clientId);
    } else {
      subtitleEl.textContent = "";
      statusEl.textContent = "";
      document.getElementById("search-section").style.display = "block";
    }
  </script>
</body>
</html>
