<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#05060f" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cortes Simulador" />
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
<title>Cortes recomendados</title>
<link rel="stylesheet" href="assets/theme.css" />
<style>
  #subtitle { color: var(--text-dim); margin-top: 0; font-size: 14px; max-width: 640px; }
  .face-shape-hint { font-size: 12px; color: var(--accent-cyan); margin-top: 6px; display: block; }
  #status { font-size: 14px; color: var(--text-dim); margin: 16px 0; }

  #search-section { display: none; margin: 8px 0 28px; max-width: 420px; }
  #search-section input[type="text"] { margin-bottom: 8px; }
  #search-section button { width: auto; padding: 10px 18px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
    margin-top: 8px;
    align-items: start;
  }
  .card {
    border: 1px solid var(--glass-border); border-radius: 14px; overflow: hidden;
    display: flex; flex-direction: column; background: var(--glass);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .card img { width: 100%; height: 220px; object-fit: cover; display: block; background: rgba(255,255,255,0.05); border-radius: 0; }
  .no-photo {
    width: 100%; height: 220px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.04); color: var(--text-faint); font-size: 13px; text-align: center; padding: 12px; box-sizing: border-box;
  }
  .card-body { padding: 14px 16px 18px; }
  .card-body h3 { margin: 0 0 2px; font-size: 16px; color: var(--text-main); }
  .family-hint { margin: 0 0 12px; font-size: 12px; color: var(--text-faint); }
  .cut-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .cut-item { border-top: 1px solid var(--glass-border); padding-top: 10px; }
  .cut-item:first-child { border-top: none; padding-top: 0; }
  .cut-item.con-aviso { background: var(--warning-bg); margin: 0 -16px; padding: 10px 16px; border-top-color: var(--warning-border); border-radius: 8px; }
  .cut-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--text-main); }
  .cut-desc { margin: 0 0 6px; font-size: 12px; color: var(--text-dim); }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .badge {
    font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(79, 124, 255, 0.18); color: #c7d4ff;
    white-space: nowrap;
  }
  .badge.fade { background: rgba(52, 211, 153, 0.15); color: #86e6c4; }
  .note { font-size: 12px; color: var(--warning); margin-top: 4px; }
  .source { font-size: 10px; color: var(--text-faint); margin-top: 2px; }
  details > summary { cursor: pointer; font-size: 12px; color: var(--accent-cyan); padding-top: 8px; }
  details[open] > summary { margin-bottom: 6px; }
</style>
</head>
<body>
<div class="page-shell">
  <nav class="top-nav">
    <a href="inicio.html">← Inicio</a>
    <a href="index.html">Simulación de cortes</a>
    <a id="growth-map-link" href="growth-map.html">Mapa de remolinos y dirección del pelo</a>
  </nav>

  <h1 class="page-title">Cortes recomendados</h1>
  <p id="subtitle">Cargando...</p>

  <div id="search-section">
    <label for="search-name">Escribe tu nombre tal como lo diste en la barbería</label>
    <input type="text" id="search-name" placeholder="Ej: Pedro Gómez Martínez" />
    <button id="search-btn" type="button" class="secondary">Buscar mi perfil</button>
  </div>

  <div id="status"></div>
  <div id="grid" class="grid"></div>
</div>

  <script>
    const API_BASE = "http://localhost:8000/api";
    const params = new URLSearchParams(window.location.search);
    const clientId = params.get("client_id");

    const subtitleEl = document.getElementById("subtitle");
    const statusEl = document.getElementById("status");
    const gridEl = document.getElementById("grid");
    const growthMapLink = document.getElementById("growth-map-link");

    const HAIR_TEXTURE_LABELS = {
      liso: "liso", ondulado: "ondulado", rizado: "rizado", afro: "afro",
    };
    const FACE_SHAPE_LABELS = {
      ovalada: "ovalada", redonda: "redonda", cuadrada: "cuadrada", alargada: "alargada",
    };
    const FADE_LABELS = {
      ninguno: "sin degradado", bajo: "fade bajo", medio: "fade medio",
      alto: "fade alto", skin: "fade a piel",
    };
    const LENGTH_LABELS = {
      corto: "corto", medio: "medio", largo: "largo", extra_largo: "extra largo",
    };
    // Etiquetas legibles para las "familias visuales" usadas para agrupar
    // cortes que comparten una misma foto de referencia de stock (ver
    // backend/app/pipeline/style_catalog.py y el script que las asignó).
    // Sin esto, la página listaba una tarjeta por cada uno de los 104
    // cortes del catálogo repitiendo la misma foto una y otra vez.
    const FAMILY_LABELS = {
      mullet: "Mullet",
      fade_undercut_textura: "Fade / undercut con textura",
      tupe_pompadour_clasico: "Tupé / pompadour clásico",
      buzz_corto_uniforme: "Buzz cut / corte corto uniforme",
      corte_texturizado_general: "Corte corto texturizado",
      clasico_raya_lateral: "Clásico con raya lateral",
      rastas_trenzas_locs: "Rastas / trenzas",
      recogido_mono_coleta: "Moño / coleta recogida",
      melena_larga: "Melena larga",
      afro_rizado_voluminoso: "Afro / rizado voluminoso",
      corte_tazon_bowl_liso: "Corte tazón (bowl cut) — pelo liso/ondulado",
      corte_tazon_bowl_rizado: "Corte tazón (bowl cut) — pelo rizado",
    };

    const MAX_VISIBLE_PER_FAMILY = 4;

    function cutBadgesHtml(s) {
      const badges = [];
      if (s.length_category) badges.push(`<span class="badge">${LENGTH_LABELS[s.length_category] || s.length_category}</span>`);
      badges.push(`<span class="badge fade">${FADE_LABELS[s.fade_type] || s.fade_type}</span>`);
      return `<div class="badges">${badges.join("")}</div>`;
    }

    function cutItemHtml(rec) {
      const s = rec.style;
      const noteHtml = rec.note ? `<div class="note">⚠️ ${rec.note}</div>` : "";
      const sourceHtml = s.source ? `<div class="source">${s.source}</div>` : "";
      return `
        <li class="cut-item${rec.note ? " con-aviso" : ""}">
          <div class="cut-name">${s.name}</div>
          ${cutBadgesHtml(s)}
          <p class="cut-desc">${s.description || ""}</p>
          ${noteHtml}
          ${sourceHtml}
        </li>
      `;
    }

    function renderFamilyCard(family) {
      const card = document.createElement("div");
      card.className = "card";

      const photoHtml = family.referenceImage
        ? `<img src="${family.referenceImage}" alt="Foto de referencia: ${family.label}" loading="lazy" />`
        : `<div class="no-photo">No encontramos una foto de stock que representara bien este estilo todavía</div>`;

      const visible = family.items.slice(0, MAX_VISIBLE_PER_FAMILY);
      const rest = family.items.slice(MAX_VISIBLE_PER_FAMILY);

      const hintText = family.items.length === 1
        ? "1 corte del catálogo que encaja con este cliente"
        : `${family.items.length} cortes del catálogo con este estilo que encajan con este cliente — comparten esta foto de referencia por ser visualmente muy similares`;

      const visibleHtml = visible.map(cutItemHtml).join("");
      const restHtml = rest.length
        ? `<details><summary>Ver ${rest.length} corte${rest.length === 1 ? "" : "s"} más de este estilo</summary>
             <ul class="cut-list">${rest.map(cutItemHtml).join("")}</ul>
           </details>`
        : "";

      card.innerHTML = `
        ${photoHtml}
        <div class="card-body">
          <h3>${family.label}</h3>
          <p class="family-hint">${hintText}</p>
          <ul class="cut-list">${visibleHtml}</ul>
          ${restHtml}
        </div>
      `;
      return card;
    }

    function groupByFamily(recommendations) {
      const families = new Map();
      for (const rec of recommendations) {
        const key = rec.style.style_family || rec.style.id;
        if (!families.has(key)) {
          families.set(key, {
            key,
            label: FAMILY_LABELS[key] || rec.style.style_family || rec.style.name,
            referenceImage: rec.style.reference_image,
            items: [],
          });
        }
        families.get(key).items.push(rec);
      }
      // El orden de inserción ya viene de la lista original (los cortes
      // sin aviso de remolinos primero), así que las familias que solo
      // tienen avisos quedan al final de forma natural.
      return Array.from(families.values());
    }

    async function loadForClientId(id) {
      growthMapLink.href = `growth-map.html?client_id=${encodeURIComponent(id)}`;

      try {
        const clientRes = await fetch(`${API_BASE}/clients/${id}`);
        if (!clientRes.ok) {
          subtitleEl.textContent = "";
          statusEl.innerHTML = '<span class="warning">No se encontró este cliente.</span>';
          return;
        }
        const client = await clientRes.json();
        const name = client.display_name || "este cliente";

        const recRes = await fetch(`${API_BASE}/clients/${id}/recommendations`);
        if (recRes.status === 422) {
          const err = await recRes.json();
          subtitleEl.textContent = `Para ${name}`;
          statusEl.innerHTML = `<span class="warning">${err.detail}</span>`;
          return;
        }
        if (!recRes.ok) {
          const err = await recRes.json().catch(() => ({}));
          statusEl.innerHTML = `<span class="warning">Error: ${err.detail || recRes.statusText}</span>`;
          return;
        }
        const data = await recRes.json();

        const whorlText = data.whorl_count > 0
          ? ` · ${data.whorl_count} remolino${data.whorl_count === 1 ? "" : "s"} marcado${data.whorl_count === 1 ? "" : "s"}`
          : "";
        const faceShapeText = data.face_shape
          ? ` · forma de cara: ${FACE_SHAPE_LABELS[data.face_shape] || data.face_shape}`
          : "";
        const faceShapeHintHtml = !data.face_shape
          ? '<div class="face-shape-hint">No tienes guardada la forma de cara de este cliente — las recomendaciones solo tienen en cuenta el tipo de pelo. Puedes añadirla desde el mapa de remolinos.</div>'
          : "";
        subtitleEl.innerHTML =
          `Para ${name} · tipo de pelo: ${HAIR_TEXTURE_LABELS[data.hair_texture] || data.hair_texture}${faceShapeText}${whorlText}${faceShapeHintHtml}`;

        if (data.recommendations.length === 0) {
          statusEl.textContent = "No hay cortes del catálogo compatibles con este tipo de pelo todavía.";
          return;
        }

        const families = groupByFamily(data.recommendations);
        statusEl.textContent =
          `${data.recommendations.length} cortes recomendados, agrupados en ${families.length} estilos.`;
        gridEl.innerHTML = "";
        for (const family of families) {
          gridEl.appendChild(renderFamilyCard(family));
        }
      } catch (e) {
        statusEl.innerHTML = `<span class="warning">Error de red: ${e.message}</span>`;
      }
    }

    async function searchByName() {
      const name = document.getElementById("search-name").value.trim();
      if (!name) {
        statusEl.innerHTML = '<span class="warning">Escribe un nombre para buscar.</span>';
        return;
      }
      statusEl.textContent = "Buscando...";
      try {
        const res = await fetch(`${API_BASE}/clients`);
        const clients = await res.json();
        const match = clients.find(
          (c) => (c.display_name || "").trim().toLowerCase() === name.toLowerCase()
        );
        if (!match) {
          statusEl.innerHTML = '<span class="warning">No encontramos ningún perfil con ese nombre exacto. Pregunta en el mostrador cómo lo registraron.</span>';
          return;
        }
        // Deja la URL apuntando a este cliente, para poder recargar o
        // compartir el enlace directamente la próxima vez.
        const newUrl = `${window.location.pathname}?client_id=${encodeURIComponent(match.id)}`;
        window.history.replaceState({}, "", newUrl);
        document.getElementById("search-section").style.display = "none";
        await loadForClientId(match.id);
      } catch (e) {
        statusEl.innerHTML = `<span class="warning">Error de red: ${e.message}</span>`;
      }
    }

    document.getElementById("search-btn").addEventListener("click", searchByName);
    document.getElementById("search-name").addEventListener("keydown", (e) => {
      if (e.key === "Enter") searchByName();
    });

    if (clientId) {
      loadForClientId(clientId);
    } else {
      subtitleEl.textContent = "";
      statusEl.textContent = "";
      document.getElementById("search-section").style.display = "block";
    }
  </script>
</body>
</html>
