<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#05060f" />
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Cortes Simulador" />
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
<title>Catálogo de cortes</title>
<link rel="stylesheet" href="assets/theme.css" />
<style>
  .page-shell { max-width: 1180px; }
  .page-head { margin-bottom: 16px; }
  #status { font-size: 13px; color: var(--text-faint); margin: 12px 0; }

  /* Filtros: una fila de desplegables compactos, sin etiquetas (el propio
     desplegable dice qué filtra). Se resaltan los que están activos. */
  .filters { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; }
  .filters::-webkit-scrollbar { display: none; }
  .filters-ico { color: var(--text-faint); flex: none; }
  .filters select { width: auto; flex: none; min-width: 0; min-height: 40px; padding: 8px 28px 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .filters select.active { border-color: var(--accent-cyan); color: var(--accent-cyan); background: rgba(79, 227, 255, 0.08); }
  .filters .icon-btn { width: 40px; height: 40px; min-height: 40px; border-radius: 50%; }
  .filters .icon-btn[hidden] { display: none; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 22px;
    margin-top: 8px;
    align-items: start;
  }

  /* --- Tarjetas rediseñadas ------------------------------------------- */
  .card {
    position: relative;
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: var(--glass);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:hover {
    transform: translateY(-4px);
    border-color: rgba(255, 255, 255, 0.28);
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(79, 124, 255, 0.18);
  }

  .card-photo {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 5;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.05);
    cursor: zoom-in;
  }
  .card-photo img {
    width: 100%; height: 100%; object-fit: cover; display: block;
    border-radius: 0;
    transition: transform 0.5s ease;
  }
  .card:hover .card-photo img { transform: scale(1.08); }

  /* Degradado inferior para que el título "flote" sobre la foto y separe
     visualmente la imagen del cuerpo de la tarjeta sin un corte brusco. */
  .card-photo::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(5, 6, 15, 0.75) 0%, rgba(5, 6, 15, 0) 45%);
    pointer-events: none;
  }

  .zoom-hint {
    position: absolute; top: 10px; right: 10px;
    display: flex; align-items: center; gap: 5px;
    padding: 6px 10px; border-radius: 999px;
    background: rgba(5, 6, 15, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff; font-size: 11px; font-weight: 600;
    opacity: 0; transform: translateY(-4px);
    transition: opacity 0.25s ease, transform 0.25s ease;
    pointer-events: none;
    backdrop-filter: blur(6px);
  }
  .card:hover .zoom-hint { opacity: 1; transform: translateY(0); }
  .zoom-hint svg { width: 13px; height: 13px; }

  .no-photo {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.04); color: var(--text-faint); font-size: 13px; text-align: center; padding: 12px; box-sizing: border-box;
  }

  .card-body { padding: 16px 18px 20px; position: relative; }
  .card-body h3 {
    margin: 0 0 3px; font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
    color: var(--text-main);
  }
  .family-hint { margin: 0 0 10px; font-size: 12px; color: var(--text-faint); display: flex; align-items: center; gap: 6px; }
  .card-body h3 { margin-bottom: 8px; }

  .cut-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .cut-item { border-top: 1px solid var(--glass-border); padding-top: 12px; }
  .cut-item:first-child { border-top: none; padding-top: 0; }
  .cut-name { font-size: 13.5px; font-weight: 600; margin-bottom: 5px; color: var(--text-main); }
  .cut-desc { margin: 0 0 7px; font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }

  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .badge {
    font-size: 11px; padding: 4px 10px; border-radius: 999px;
    background: rgba(79, 124, 255, 0.18); color: #c7d4ff;
    white-space: nowrap; border: 1px solid rgba(79, 124, 255, 0.28);
  }
  .badge.fade { background: rgba(52, 211, 153, 0.15); color: #86e6c4; border-color: rgba(52, 211, 153, 0.3); }
  .badge .ico { width: 11px; height: 11px; margin-right: 3px; vertical-align: -1px; }
  .source { font-size: 10px; color: var(--text-faint); margin-top: 2px; }

  .card details > summary {
    cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--accent-cyan);
    padding-top: 10px; list-style: none;
  }
  .card details > summary::-webkit-details-marker { display: none; }
  .card details[open] > summary { margin-bottom: 8px; }

  /* --- Lightbox / zoom -------------------------------------------------- */
  .lightbox {
    position: fixed; inset: 0; z-index: 50;
    display: none;
    align-items: center; justify-content: center;
    padding: 24px;
    background: rgba(3, 4, 10, 0.86);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    animation: lb-fade-in 0.2s ease;
  }
  .lightbox.open { display: flex; }
  @keyframes lb-fade-in { from { opacity: 0; } to { opacity: 1; } }

  .lightbox-inner {
    position: relative;
    max-width: min(900px, 92vw);
    max-height: 88vh;
    display: flex; flex-direction: column;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    animation: lb-pop-in 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @keyframes lb-pop-in { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .lightbox-img-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }
  .lightbox-img-wrap img {
    max-width: 100%; max-height: 78vh; width: auto; height: auto;
    object-fit: contain; display: block; border-radius: 0;
  }
  .lightbox-caption {
    padding: 14px 20px 16px;
    border-top: 1px solid var(--glass-border);
  }
  .lightbox-caption h3 { margin: 0 0 4px; font-size: 16px; color: var(--text-main); }
  .lightbox-caption p { margin: 0; font-size: 13px; color: var(--text-dim); }

  .lightbox-close {
    position: absolute; top: 12px; right: 12px;
    width: 36px; height: 36px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    background: rgba(5, 6, 15, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff; font-size: 18px; line-height: 1;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
  }
  .lightbox-close .ico { width: 18px; height: 18px; }
  .try-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 9px 16px; border-radius: 999px;
             background: linear-gradient(120deg, var(--accent-blue), #7a5cff); color: #fff; text-decoration: none; font-weight: 700; font-size: 13px; }
  .lb-hair { display: flex; align-items: center; gap: 6px; margin-top: 8px; color: var(--text-faint); font-size: 12.5px; }
  .lightbox-close:hover { background: rgba(5, 6, 15, 0.85); transform: scale(1.06); }

  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .card-body { padding: 10px 10px 12px; }
    .card-body h3 { font-size: 14px; }
    .zoom-hint { display: none; }
  }
</style>
</head>
<body>
<div class="page-shell">
  <nav class="top-nav">
    <a href="inicio.html" aria-label="Inicio"><span data-icon="house"></span></a>
    <a href="index.html" title="Simular corte"><span data-icon="wand-sparkles"></span><span class="lbl">Simular</span></a>
    <a href="recomendaciones.html" title="Mis recomendaciones"><span data-icon="sparkles"></span><span class="lbl">Recomendaciones</span></a>
  </nav>

  <div class="head-row page-head">
    <h1 class="page-title">Catálogo</h1>
    <details class="info"><summary></summary><div class="info-body">
      Todos los cortes de la barbería. Filtra por tipo de pelo, largo o degradado, y toca una foto para ampliarla y leer la descripción.
    </div></details>
  </div>

  <div class="filters">
    <span class="filters-ico" data-icon="sliders-horizontal"></span>
    <select id="filter-hair" aria-label="Tipo de pelo">
      <option value="">Pelo</option>
      <option value="liso">Liso</option>
      <option value="ondulado">Ondulado</option>
      <option value="rizado">Rizado</option>
      <option value="afro">Afro</option>
    </select>
    <select id="filter-length" aria-label="Longitud">
      <option value="">Largo</option>
      <option value="corto">Corto</option>
      <option value="medio">Medio</option>
      <option value="largo">Largo</option>
      <option value="extra_largo">Extra largo</option>
    </select>
    <select id="filter-fade" aria-label="Degradado">
      <option value="">Degradado</option>
      <option value="ninguno">Sin degradado</option>
      <option value="bajo">Fade bajo</option>
      <option value="medio">Fade medio</option>
      <option value="alto">Fade alto</option>
      <option value="skin">Fade a piel</option>
    </select>
    <button id="clear-filters" type="button" class="secondary icon-btn" aria-label="Quitar filtros" title="Quitar filtros" hidden><span data-icon="filter-x"></span></button>
  </div>

  <div id="status"></div>
  <div id="grid" class="grid"></div>
</div>

<!-- Lightbox / zoom de foto ------------------------------------------- -->
<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="lightbox-inner">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Cerrar"><span data-icon="x"></span></button>
    <div class="lightbox-img-wrap">
      <img id="lightbox-img" src="" alt="" />
    </div>
    <div class="lightbox-caption">
      <h3 id="lightbox-title"></h3>
      <p id="lightbox-desc"></p>
      <a id="lightbox-try" class="try-btn" href="index.html"><span data-icon="wand-sparkles"></span>Probar en un cliente</a>
    </div>
  </div>
</div>

  <script src="assets/ui.js"></script>
  <script src="assets/session.js"></script>
  <script>
    // Ruta RELATIVA a propósito (no "http://localhost:8000/api" fijo, como
    // estaba antes): el backend sirve este mismo HTML como estático (ver
    // el mount de StaticFiles en app/main.py), así que la API siempre está
    // en el mismo origen que la página, sea localhost, la IP local en la
    // WiFi de la barbería, o el dominio real de Railway en producción. La
    // URL fija rompía los tres casos salvo el primero -- detectado al
    // probar la web ya desplegada de verdad (catálogo/simulador daban
    // "Failed to fetch" porque intentaban llamar al localhost del propio
    // dispositivo del cliente, no al servidor real).
    const API_BASE = "/api";
    const statusEl = document.getElementById("status");
    const gridEl = document.getElementById("grid");
    const hairSelect = document.getElementById("filter-hair");
    const lengthSelect = document.getElementById("filter-length");
    const fadeSelect = document.getElementById("filter-fade");

    const FADE_LABELS = {
      ninguno: "sin degradado", bajo: "fade bajo", medio: "fade medio",
      alto: "fade alto", skin: "fade a piel",
    };
    const LENGTH_LABELS = {
      corto: "corto", medio: "medio", largo: "largo", extra_largo: "extra largo",
    };
    // Mismas "familias visuales" que en recomendaciones.html — varios
    // cortes del catálogo comparten una misma foto de referencia por ser
    // visualmente muy similares (ver backend/app/pipeline/style_catalog.py).
    const FAMILY_LABELS = {
      mullet: "Mullet",
      fade_undercut_textura: "Fade / undercut con textura",
      tupe_pompadour_clasico: "Tupé / pompadour clásico",
      buzz_corto_uniforme: "Buzz cut / corte corto uniforme",
      corte_texturizado_general: "Corte corto texturizado",
      clasico_raya_lateral: "Clásico con raya lateral",
      rastas_trenzas_locs: "Rastas / trenzas",
      recogido_mono_coleta: "Moño / coleta recogida",
      melena_larga: "Melena larga",
      afro_rizado_voluminoso: "Afro / rizado voluminoso",
      corte_tazon_bowl_liso: "Corte tazón (bowl cut) — pelo liso/ondulado",
      corte_tazon_bowl_rizado: "Corte tazón (bowl cut) — pelo rizado",
    };

    const MAX_VISIBLE_PER_FAMILY = 4;
    let allStyles = [];

    const ZOOM_ICON_SVG = `<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="2"/>
      <path d="M20 20L15.2 15.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>`;

    function cutBadgesHtml(s) {
      const badges = [];
      if (s.length_category) badges.push(`<span class="badge">${LENGTH_LABELS[s.length_category] || s.length_category}</span>`);
      badges.push(`<span class="badge fade">${FADE_LABELS[s.fade_type] || s.fade_type}</span>`);
      if (s.maintenance_weeks) badges.push(`<span class="badge" title="Retoque cada ${s.maintenance_weeks[0]}-${s.maintenance_weeks[1]} semanas">${UI.icon("calendar-clock")}${s.maintenance_weeks[0]}-${s.maintenance_weeks[1]} sem.</span>`);
      // Los tipos de pelo no van en la tarjeta (demasiadas etiquetas): se
      // filtran con el desplegable "Pelo" y se ven al ampliar la foto.
      return `<div class="badges">${badges.join("")}</div>`;
    }

    function cutItemHtml(s) {
      return `
        <li class="cut-item">
          <div class="cut-name">${s.name}</div>
          ${cutBadgesHtml(s)}

        </li>
      `;
    }

    function renderFamilyCard(family) {
      const card = document.createElement("div");
      card.className = "card";

      const photoHtml = family.referenceImage
        ? `<div class="card-photo" data-img="${family.referenceImage}" data-title="${family.label}" data-desc="${(family.items[0] && family.items[0].description) || ""}" data-hair="${((family.items[0] && family.items[0].suitable_hair_types) || []).join(",")}" data-id="${family.items[0] ? family.items[0].id : ""}">
             <img src="${family.referenceImage}" alt="Foto de referencia: ${family.label}" loading="lazy" />
             <span class="zoom-hint">${UI.icon("zoom-in")}</span>
           </div>`
        : `<div class="card-photo" style="cursor:default;"><div class="no-photo">${UI.icon("image")}</div></div>`;

      const visible = family.items.slice(0, MAX_VISIBLE_PER_FAMILY);
      const rest = family.items.slice(MAX_VISIBLE_PER_FAMILY);

      // Un corte por foto (lo normal): solo nombre y etiquetas; la
      // descripción se lee al ampliar la foto. Si varios comparten foto, se
      // listan sus nombres y el resto va plegado.
      if (family.items.length === 1) {
        card.innerHTML = `
          ${photoHtml}
          <div class="card-body">
            <h3>${family.label}</h3>
            ${cutBadgesHtml(family.items[0])}
          </div>
        `;
        return card;
      }
      const visibleHtml = visible.map(cutItemHtml).join("");
      const restHtml = rest.length
        ? `<details><summary>+${rest.length}</summary>
             <ul class="cut-list">${rest.map(cutItemHtml).join("")}</ul>
           </details>`
        : "";

      card.innerHTML = `
        ${photoHtml}
        <div class="card-body">
          <h3>${family.label}</h3>
          <p class="family-hint">${UI.icon("scissors")}${family.items.length}</p>
          <ul class="cut-list">${visibleHtml}</ul>
          ${restHtml}
        </div>
      `;
      return card;
    }

    function groupByFamily(styles) {
      const families = new Map();
      for (const s of styles) {
        // Cada estilo con foto propia forma su propio grupo (catalogo casi 1:1).
        // Solo se agrupan varios cortes juntos cuando comparten literalmente la
        // misma imagen de referencia (fallback histórico por familia/id).
        const key = s.reference_image || s.style_family || s.id;
        if (!families.has(key)) {
          families.set(key, {
            key,
            label: FAMILY_LABELS[s.style_family || s.id] || s.style_family || s.name,
            referenceImage: s.reference_image,
            items: [],
          });
        }
        families.get(key).items.push(s);
      }
      // Si el grupo terminó con un unico corte, usamos el nombre propio de ese
      // corte como etiqueta (mas preciso que la etiqueta generica de familia).
      for (const family of families.values()) {
        if (family.items.length === 1) {
          family.label = family.items[0].name;
        }
      }
      return Array.from(families.values());
    }

    function applyFiltersAndRender() {
      for (const sel of [hairSelect, lengthSelect, fadeSelect]) sel.classList.toggle("active", !!sel.value);
      document.getElementById("clear-filters").hidden = !(hairSelect.value || lengthSelect.value || fadeSelect.value);
      const hair = hairSelect.value;
      const length = lengthSelect.value;
      const fade = fadeSelect.value;

      const filtered = allStyles.filter((s) => {
        if (hair && !(s.suitable_hair_types || []).includes(hair)) return false;
        if (length && s.length_category !== length) return false;
        if (fade && s.fade_type !== fade) return false;
        return true;
      });

      if (filtered.length === 0) {
        statusEl.textContent = "Sin resultados";
        gridEl.innerHTML = "";
        return;
      }

      const families = groupByFamily(filtered);
      statusEl.textContent = `${filtered.length} cortes`;
      gridEl.innerHTML = "";
      for (const family of families) {
        const card = renderFamilyCard(family);
        // Cliente con sesión: corazón para guardar el corte en favoritos.
        if (viewer === "cliente" && family.items.length === 1) {
          card.querySelector(".card-photo").insertAdjacentHTML("beforeend", Session.heartHtml(family.items[0].id));
        }
        gridEl.appendChild(card);
      }
    }

    async function load() {
      statusEl.textContent = "Cargando…";
      try {
        const res = await fetch(`${API_BASE}/styles`);
        if (!res.ok) {
          statusEl.innerHTML = `<span class="warning">Error al cargar el catálogo: ${res.statusText}</span>`;
          return;
        }
        allStyles = await res.json();
        applyFiltersAndRender();
      } catch (e) {
        statusEl.innerHTML = `<span class="warning">Sin conexión: ${e.message}</span>`;
      }
    }

    hairSelect.addEventListener("change", applyFiltersAndRender);
    lengthSelect.addEventListener("change", applyFiltersAndRender);
    fadeSelect.addEventListener("change", applyFiltersAndRender);
    document.getElementById("clear-filters").addEventListener("click", () => {
      hairSelect.value = "";
      lengthSelect.value = "";
      fadeSelect.value = "";
      applyFiltersAndRender();
    });

    // --- Lightbox / zoom -------------------------------------------------
    const lightboxEl = document.getElementById("lightbox");
    const lightboxImgEl = document.getElementById("lightbox-img");
    const lightboxTitleEl = document.getElementById("lightbox-title");
    const lightboxDescEl = document.getElementById("lightbox-desc");
    const lightboxCloseEl = document.getElementById("lightbox-close");
    let lastFocusedEl = null;

    function openLightbox(src, title, desc) {
      lightboxImgEl.src = src;
      lightboxImgEl.alt = title || "";
      lightboxTitleEl.textContent = title || "";
      lightboxDescEl.textContent = desc || "";
      const hairTypes = (arguments[3] || []).join(" · ");
      if (hairTypes) lightboxDescEl.insertAdjacentHTML("beforeend", `<span class="lb-hair">${UI.icon("scissors")}${hairTypes}</span>`);
      lightboxEl.classList.add("open");
      lightboxEl.setAttribute("aria-hidden", "false");
      lastFocusedEl = document.activeElement;
      lightboxCloseEl.focus();
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightboxEl.classList.remove("open");
      lightboxEl.setAttribute("aria-hidden", "true");
      lightboxImgEl.src = "";
      document.body.style.overflow = "";
      if (lastFocusedEl && lastFocusedEl.focus) lastFocusedEl.focus();
    }

    gridEl.addEventListener("click", (ev) => {
      const photo = ev.target.closest(".card-photo[data-img]");
      if (!photo) return;
      // "Probar": el cliente lo prueba sobre su foto; el peluquero, en el
      // simulador; quien no ha entrado no ve el botón.
      const tryBtn = document.getElementById("lightbox-try");
      const sid = encodeURIComponent(photo.dataset.id || "");
      tryBtn.hidden = !viewer;
      tryBtn.href = viewer === "cliente" ? `probar.html?style=${sid}` : `index.html?style=${sid}`;
      tryBtn.lastChild.textContent = viewer === "cliente" ? "Probar en mí" : "Probar en un cliente";
      openLightbox(photo.dataset.img, photo.dataset.title, photo.dataset.desc, (photo.dataset.hair || "").split(",").filter(Boolean));
    });

    lightboxCloseEl.addEventListener("click", closeLightbox);
    lightboxEl.addEventListener("click", (ev) => {
      if (ev.target === lightboxEl) closeLightbox();
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Escape" && lightboxEl.classList.contains("open")) closeLightbox();
    });

    // Quién mira el catálogo: cliente con sesión, peluquero o nadie.
    let viewer = null;
    (async () => {
      const me = await Session.optionalClient();
      if (me) {
        viewer = "cliente";
        Session.setLikes(me.liked_styles);
        document.querySelector('nav a[aria-label="Inicio"]').href = "cliente.html";
      } else if (Session.isQr()) {
        document.querySelector('nav a[aria-label="Inicio"]').href = "cliente.html";
      } else {
        try { if ((await (await fetch("/api/barber/session")).json()).logged_in) viewer = "peluquero"; } catch (e) { /* anónimo */ }
      }
      load();
    })();
  </script>
</body>
